name: Build Trishula Kernel

on:
  workflow_dispatch:

  schedule:
    # Every Sunday at 02:00 UTC / 07:30 IST
    - cron: '0 2 * * 0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_CODENAME: RMX1851
  KERNEL_NAME: Trishula

  KERNEL_DEFCONFIG: sdm670-perf_defconfig
  KERNEL_IMAGE: Image.gz-dtb

  ARCH: arm64
  SUBARCH: arm64

  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

  # LLVM 23.1.1
  LLVM_VERSION: 23.1.1
  LLVM_ARCHIVE: llvm-23.1.1-x86_64.tar.xz
  LLVM_ARCHIVE_SHA256: 4511aee50112bf96d8f5108daa8bc1b99283fab51d37068758f91b9217940129

  KBUILD_BUILD_USER: Trishula
  KBUILD_BUILD_HOST: github-actions

jobs:
  build:
    name: Build Trishula Kernel
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # ------------------------------------------------------------
      # Update KernelSU submodule
      # ------------------------------------------------------------
      - name: Update KernelSU submodule
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       UPDATE KERNELSU SUBMODULE"
          echo "========================================"

          git submodule sync KernelSU

          git submodule update \
            --init \
            --remote \
            KernelSU

          echo
          echo "KernelSU commit:"
          git -C KernelSU log -1 --oneline

      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            git-lfs \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            make \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ------------------------------------------------------------
      # Ccache
      # ------------------------------------------------------------
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-rmx1851-clang23
          max-size: 10G

      # ------------------------------------------------------------
      # Install LLVM 23.1.1
      # ------------------------------------------------------------
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "          LLVM ${LLVM_VERSION}"
          echo "========================================"

          LLVM_URL="https://www.kernel.org/pub/tools/llvm/files/${LLVM_ARCHIVE}"

          LLVM_DIR="${RUNNER_TEMP}/llvm-${LLVM_VERSION}"

          mkdir -p "${LLVM_DIR}"

          echo
          echo "Downloading:"
          echo "${LLVM_URL}"

          wget -q --show-progress \
            "${LLVM_URL}" \
            -O "${RUNNER_TEMP}/${LLVM_ARCHIVE}"

          echo
          echo "Checking SHA256..."

          echo "${LLVM_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${LLVM_ARCHIVE}" \
            | sha256sum -c -

          echo
          echo "Extracting LLVM..."

          tar -xJf \
            "${RUNNER_TEMP}/${LLVM_ARCHIVE}" \
            -C "${LLVM_DIR}" \
            --strip-components=1

          echo "${LLVM_DIR}/bin" >> "${GITHUB_PATH}"

          echo "LLVM_DIR=${LLVM_DIR}" >> "${GITHUB_ENV}"

          echo
          echo "Clang:"
          "${LLVM_DIR}/bin/clang" --version

          echo
          echo "LLD:"
          "${LLVM_DIR}/bin/ld.lld" --version

          echo
          echo "Checking LLVM version..."

          "${LLVM_DIR}/bin/clang" --version \
            | grep -F "clang version ${LLVM_VERSION}"

          "${LLVM_DIR}/bin/ld.lld" --version \
            | grep -F "LLD ${LLVM_VERSION}"

      # ------------------------------------------------------------
      # Configure LLVM environment
      # ------------------------------------------------------------
      - name: Configure LLVM environment
        shell: bash
        run: |
          set -euo pipefail

          echo "LLVM_DIR=${LLVM_DIR}"

          echo
          echo "Using clang:"
          which clang
          clang --version

          echo
          echo "Using ld.lld:"
          which ld.lld
          ld.lld --version

      # ------------------------------------------------------------
      # Verify KernelSU
      # ------------------------------------------------------------
      - name: Verify KernelSU
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "          KERNELSU CHECK"
          echo "========================================"

          echo
          echo "Submodules:"
          git submodule status --recursive

          echo
          echo "Checking KernelSU..."

          test -d KernelSU
          test -f KernelSU/kernel/Kconfig
          test -f KernelSU/kernel/Makefile

          echo
          echo "KernelSU commit:"
          git -C KernelSU log -1 --oneline

          echo
          echo "KernelSU status:"
          git -C KernelSU status --short

          echo
          echo "KernelSU symlink:"
          ls -l drivers/kernelsu

          test "$(readlink drivers/kernelsu)" = "../KernelSU/kernel"

          echo
          echo "KernelSU verification passed."

      # ------------------------------------------------------------
      # Build kernel
      # ------------------------------------------------------------
      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          BUILD_OUTPUT="${GITHUB_WORKSPACE}/out"

          rm -rf "${BUILD_OUTPUT}"
          mkdir -p "${BUILD_OUTPUT}"

          echo "========================================"
          echo "          TRISHULA KERNEL"
          echo "========================================"

          echo
          echo "Device       : ${DEVICE_CODENAME}"
          echo "Defconfig    : ${KERNEL_DEFCONFIG}"
          echo "Kernel image : ${KERNEL_IMAGE}"
          echo "LLVM         : ${LLVM_VERSION}"
          echo "Architecture : ${ARCH}"

          export ARCH="${ARCH}"
          export SUBARCH="${SUBARCH}"

          export CROSS_COMPILE="${CROSS_COMPILE}"
          export CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}"

          # LLVM
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld

          # Kernel 4.9 compatibility
          export HOSTCFLAGS="-Wno-unused-command-line-argument"
          export KCFLAGS="-fuse-ld=lld"

          # ccache
          export CC="ccache clang"
          export HOSTCC="ccache gcc"

          echo
          echo "clang:"
          which clang
          clang --version

          echo
          echo "ld.lld:"
          which ld.lld
          ld.lld --version

          # --------------------------------------------------------
          # Defconfig
          # --------------------------------------------------------
          echo
          echo "========================================"
          echo "             DEFCONFIG"
          echo "========================================"

          make -C "${GITHUB_WORKSPACE}" \
            O="${BUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            "${KERNEL_DEFCONFIG}"

          # --------------------------------------------------------
          # Olddefconfig
          # --------------------------------------------------------
          echo
          echo "========================================"
          echo "           OLDDEFCONFIG"
          echo "========================================"

          make -C "${GITHUB_WORKSPACE}" \
            O="${BUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            olddefconfig

          # --------------------------------------------------------
          # Build
          # --------------------------------------------------------
          echo
          echo "========================================"
          echo "             BUILD KERNEL"
          echo "========================================"

          make -C "${GITHUB_WORKSPACE}" \
            -j"$(nproc --all)" \
            O="${BUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            KCFLAGS="${KCFLAGS}"

      # ------------------------------------------------------------
      # Verify kernel
      # ------------------------------------------------------------
      - name: Verify kernel
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_PATH="out/arch/arm64/boot/${KERNEL_IMAGE}"

          echo "========================================"
          echo "          VERIFY KERNEL"
          echo "========================================"

          test -s "${KERNEL_PATH}"

          echo
          echo "Kernel image:"
          ls -lh "${KERNEL_PATH}"

          echo
          echo "vmlinux:"
          test -s out/vmlinux
          ls -lh out/vmlinux

          echo
          echo "Kernel config:"
          test -s out/.config

          echo
          echo "Kernel release:"
          test -s out/include/config/kernel.release
          cat out/include/config/kernel.release

          echo
          echo "Kernel verification passed."

      # ------------------------------------------------------------
      # Clone AnyKernel3
      # ------------------------------------------------------------
      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/Blacklucifer82/AnyKernel3.git \
            "${RUNNER_TEMP}/AnyKernel3"

          echo "ANYKERNEL=${RUNNER_TEMP}/AnyKernel3" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # Package AnyKernel3
      # ------------------------------------------------------------
      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          ANYKERNEL="${RUNNER_TEMP}/AnyKernel3"
          KERNEL_PATH="${GITHUB_WORKSPACE}/out/arch/arm64/boot/${KERNEL_IMAGE}"

          test -s "${KERNEL_PATH}"
          test -f "${ANYKERNEL}/anykernel.sh"

          echo
          echo "Copying kernel image..."

          cp "${KERNEL_PATH}" \
            "${ANYKERNEL}/${KERNEL_IMAGE}"

          # Build date in IST
          BUILD_DATE="$(TZ=Asia/Kolkata date +%Y%m%d-%H%M)"

          ZIP_NAME="${KERNEL_NAME}-${DEVICE_CODENAME}-clang${LLVM_VERSION}-${BUILD_DATE}.zip"

          cd "${ANYKERNEL}"

          zip -r9 \
            "${GITHUB_WORKSPACE}/${ZIP_NAME}" \
            . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'README.md'

          cd "${GITHUB_WORKSPACE}"

          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

          echo
          echo "========================================"
          echo "          FLASHABLE ZIP"
          echo "========================================"

          ls -lh "${ZIP_NAME}"

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Trishula-${{ env.DEVICE_CODENAME }}-${{ github.run_number }}"
          name: "Trishula-${{ env.DEVICE_CODENAME }}-${{ github.run_number }}"
          generate_release_notes: true
          files: "${{ env.ZIP_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
