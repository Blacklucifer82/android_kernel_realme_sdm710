name: Build Trishula Kernel

on:
  workflow_dispatch:

  schedule:
    # Run every 2 weeks (1st and 15th of the month at 02:00 UTC / 07:30 IST)
    - cron: '0 2 1,15 * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE_CODENAME: RMX1851
  KERNEL_NAME: Trishula-Bpf-BakaSU-SUSFS-A17

  KERNEL_DEFCONFIG: sdm670-perf_defconfig
  KERNEL_IMAGE: Image.gz-dtb

  ARCH: arm64
  SUBARCH: arm64

  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

  # Google AOSP Clang
  CLANG_VERSION: r614150

  KBUILD_BUILD_USER: Trishula
  KBUILD_BUILD_HOST: github-actions

jobs:
  build:
    name: Build Trishula Kernel
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # ------------------------------------------------------------
      # Update KernelSU (BakaSU) submodule in workspace (no branch update)
      # ------------------------------------------------------------
      - name: Fetch latest KernelSU submodule
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "    FETCH LATEST BAKASU (NO COMMIT)"
          echo "========================================"

          git submodule sync KernelSU
          git submodule update --init KernelSU

          echo
          echo "Fetching latest upstream from Baka-SU/BakaSU..."
          git -C KernelSU fetch origin main
          git -C KernelSU checkout FETCH_HEAD

          echo
          echo "Building with KernelSU (BakaSU) commit:"
          git -C KernelSU log -1 --oneline

      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            git-lfs \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            make \
            python3 \
            python-is-python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ------------------------------------------------------------
      # Ccache
      # ------------------------------------------------------------
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-rmx1851-clang-${{ env.CLANG_VERSION }}
          max-size: 10G

      # ------------------------------------------------------------
      # Install AOSP Clang r614150
      # ------------------------------------------------------------
      - name: Install AOSP Clang ${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "        AOSP CLANG ${CLANG_VERSION}"
          echo "========================================"

          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/HEAD/clang-${CLANG_VERSION}.tar.gz"
          CLANG_DIR="${RUNNER_TEMP}/clang-${CLANG_VERSION}"

          mkdir -p "${CLANG_DIR}"

          echo
          echo "Downloading AOSP Clang ${CLANG_VERSION}..."
          curl -fL --retry 3 "${CLANG_URL}" | tar -xz -C "${CLANG_DIR}"

          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"
          echo "CLANG_DIR=${CLANG_DIR}" >> "${GITHUB_ENV}"

          echo
          echo "Clang version:"
          "${CLANG_DIR}/bin/clang" --version

          echo
          echo "LLD version:"
          "${CLANG_DIR}/bin/ld.lld" --version

      # ------------------------------------------------------------
      # Build kernel
      # ------------------------------------------------------------
      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          BUILD_OUTPUT="${GITHUB_WORKSPACE}/out"

          mkdir -p "${BUILD_OUTPUT}"

          echo "========================================"
          echo "          KERNEL ENVIRONMENT"
          echo "========================================"

          # Cross compiler
          export CROSS_COMPILE="${CROSS_COMPILE}"
          export CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}"

          # LLVM
          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld

          # Kernel 4.9 compatibility
          export HOSTCFLAGS="-Wno-unused-command-line-argument"
          export KCFLAGS="-fuse-ld=lld"

          # ccache
          export CC="ccache clang"
          export HOSTCC="ccache gcc"

          echo
          echo "clang:"
          which clang
          clang --version

          echo
          echo "ld.lld:"
          which ld.lld
          ld.lld --version

          # --------------------------------------------------------
          # Defconfig
          # --------------------------------------------------------
          echo "========================================"
          echo "          CONFIGURE DEFCONFIG"
          echo "========================================"

          make -C "${GITHUB_WORKSPACE}" \
            O="${BUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            "${KERNEL_DEFCONFIG}"

          # --------------------------------------------------------
          # Olddefconfig
          # --------------------------------------------------------
          echo "========================================"
          echo "           OLDDEFCONFIG"
          echo "========================================"

          make -C "${GITHUB_WORKSPACE}" \
            O="${BUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            olddefconfig

          # --------------------------------------------------------
          # Build
          # --------------------------------------------------------
          echo "========================================"
          echo "             BUILD KERNEL"
          echo "========================================"

          make -C "${GITHUB_WORKSPACE}" \
            -j"$(nproc --all)" \
            O="${BUILD_OUTPUT}" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCFLAGS="${HOSTCFLAGS}" \
            KCFLAGS="${KCFLAGS}"

      # ------------------------------------------------------------
      # Verify kernel
      # ------------------------------------------------------------
      - name: Verify kernel
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_PATH="out/arch/arm64/boot/${KERNEL_IMAGE}"

          echo "========================================"
          echo "          VERIFY KERNEL"
          echo "========================================"

          test -s "${KERNEL_PATH}"

          echo
          echo "Kernel image:"
          ls -lh "${KERNEL_PATH}"

          echo
          echo "vmlinux:"
          test -s out/vmlinux
          ls -lh out/vmlinux

          echo
          echo "Kernel config:"
          test -s out/.config

          echo
          echo "Kernel release:"
          test -s out/include/config/kernel.release
          cat out/include/config/kernel.release

          echo
          echo "Kernel verification passed."

      # ------------------------------------------------------------
      # Clone AnyKernel3
      # ------------------------------------------------------------
      - name: Clone AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/Blacklucifer82/AnyKernel3.git \
            "${RUNNER_TEMP}/AnyKernel3"

          echo "ANYKERNEL=${RUNNER_TEMP}/AnyKernel3" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # Package AnyKernel3
      # ------------------------------------------------------------
      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          ANYKERNEL="${RUNNER_TEMP}/AnyKernel3"
          KERNEL_PATH="${GITHUB_WORKSPACE}/out/arch/arm64/boot/${KERNEL_IMAGE}"

          test -s "${KERNEL_PATH}"
          test -f "${ANYKERNEL}/anykernel.sh"

          echo
          echo "Copying kernel image..."

          cp "${KERNEL_PATH}" \
            "${ANYKERNEL}/${KERNEL_IMAGE}"

          # Build date in IST
          BUILD_DATE="$(TZ=Asia/Kolkata date +%Y%m%d-%H%M)"

          ZIP_NAME="Trishula-Bpf-BakaSU-SUSFS-A17_${BUILD_DATE}.zip"

          cd "${ANYKERNEL}"

          zip -r9 \
            "${GITHUB_WORKSPACE}/${ZIP_NAME}" \
            . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'README.md'

          cd "${GITHUB_WORKSPACE}"

          echo "BUILD_DATE=${BUILD_DATE}" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "${GITHUB_ENV}"

          echo
          echo "========================================"
          echo "          FLASHABLE ZIP"
          echo "========================================"

          ls -lh "${ZIP_NAME}"

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Trishula-Bpf-BakaSU-SUSFS-A17-${{ github.run_number }}"
          name: "Trishula-Bpf-BakaSU-SUSFS-A17 (${{ env.BUILD_DATE }})"
          generate_release_notes: true
          files: "${{ env.ZIP_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
